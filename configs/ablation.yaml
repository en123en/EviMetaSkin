    fusion_mode: gated
    ce_weight: 1.0
    evidential_weight: 0.0
  - name: image_evidential
    fusion_mode: visual_only
    ce_weight: 0.95
    evidential_weight: 0.05
  - name: concat_metadata_evidential
    fusion_mode: concat
    ce_weight: 0.95
    evidential_weight: 0.05
  - name: gated_metadata_evidential
    fusion_mode: gated
    ce_weight: 0.95
    evidential_weight: 0.05
