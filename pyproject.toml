[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evimetaskin"
version = "1.0.0"
description = "Metadata-guided evidential skin lesion malignancy classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "EviMetaSkin authors"}]

[tool.setuptools.packages.find]
include = ["evimetaskin*"]
